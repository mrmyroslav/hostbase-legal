<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Настройка Stripe завершена — HostBase</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background:#F8FAFC; color:#111827; margin:0; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid #E5E7EB; border-radius:16px; padding:32px 28px;
          max-width:420px; width:100%; text-align:center; }
  .icon { font-size:40px; line-height:1; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 10px; }
  p { font-size:14.5px; line-height:1.6; color:#4B5563; margin:0 0 22px; }
  a.btn { display:inline-block; background:#4F46E5; color:#fff; text-decoration:none;
          padding:13px 22px; border-radius:10px; font-size:14.5px; font-weight:600; }
  .muted { font-size:12.5px; color:#9CA3AF; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Настройка Stripe завершена</h1>
    <p>Вы вернулись из Stripe. Откройте приложение — статус подключения обновится автоматически, и появится возможность выставлять счета гостям.</p>
    <a class="btn" href="hostbase://">Открыть HostBase</a>
    <div class="muted">Если Stripe ещё проверяет ваши данные, приём платежей включится сам, как только проверка закончится.</div>
  </div>
</body>
</html>
