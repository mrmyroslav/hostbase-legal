<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Отписка от рассылки — HostBase</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background:#F8FAFC; color:#111827; margin:0; padding:24px 16px; }
  .card { background:#fff; border:1px solid #E5E7EB; border-radius:16px; max-width:460px;
          margin:60px auto 0; padding:30px 26px; text-align:center; }
  h1 { font-size:20px; margin:0 0 10px; }
  p { font-size:14.5px; line-height:1.65; color:#4B5563; margin:0 0 12px; }
  .ok { color:#166534; font-weight:600; }
  .err { color:#B91C1C; }
  .brand { max-width:460px; margin:22px auto 0; text-align:center; font-size:12.5px; color:#9CA3AF; }
</style>
</head>
<body>
  <div class="card" id="root"><p>Обрабатываем запрос…</p></div>
  <div class="brand">HostBase</div>

<script>
// Отписка работает без всякой авторизации: единственный ключ — токен из
// письма. Тот же приём, что у гостевой страницы бронирования.
var SUPABASE_URL = 'https://jhkfcbuexreyxuwlpstg.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_SX_FMvIvNxB1hELUKeaWTw_6Ti9G3zO';

function show(html) {
  document.getElementById('root').innerHTML = html;
}

(function () {
  var token = new URLSearchParams(window.location.search).get('token') || '';
  if (!/^[0-9a-f-]{36}$/i.test(token)) {
    show('<h1>Ссылка неполная</h1><p>Откройте ссылку из письма целиком либо напишите хозяину жилья напрямую.</p>');
    return;
  }
  fetch(SUPABASE_URL + '/rest/v1/rpc/unsubscribe_guest', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token }),
  })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
    .then(function () {
      // Ответ сервера (нашёлся токен или нет) намеренно не показываем
      // по-разному: иначе перебором можно было бы выяснять, какие токены
      // существуют. Для человека результат в обоих случаях одинаков.
      show('<h1>Готово</h1><p class="ok">Вы отписаны от рассылок.</p>'
        + '<p>Письма о ваших бронированиях — подтверждения, адрес и инструкции по заселению — приходить не перестанут: это не реклама, а необходимая информация о поездке.</p>');
    })
    .catch(function () {
      show('<h1>Не получилось</h1><p class="err">Попробуйте открыть ссылку ещё раз чуть позже или напишите хозяину жилья — он отпишет вас вручную.</p>');
    });
})();
</script>
</body>
</html>
